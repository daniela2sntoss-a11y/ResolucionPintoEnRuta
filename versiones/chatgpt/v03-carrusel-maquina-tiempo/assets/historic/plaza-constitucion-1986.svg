<title id="title">Plaza de la Constitución de Pinto, recreación histórica</title>
<desc id="desc">Ilustración documental en tonos sepia de una plaza castellana con soportales de arcos de medio punto, balconadas, galerías de madera, tejados de teja y coches de época.</desc>
